# Rendered by CI: sed __VERSION__, __CLUSTER__, __ROUTE_HOST__
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dpo
  namespace: dpo-system
imagePullSecrets:
  - name: dasmlab-ghcr-pull
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dpo-data
  namespace: dpo-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: lvms-vg1
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpo
  namespace: dpo-system
  labels:
    app.kubernetes.io/name: dpo
    app.kubernetes.io/part-of: dpo
    dasmlab.org/platform: dop
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dpo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dpo
    spec:
      serviceAccountName: dpo
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: dpo
          image: ghcr.io/lmcdasm/dpo:__VERSION__
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DPO_LISTEN
              value: ":8080"
            - name: DPO_DATA_DIR
              value: /data
            - name: DPO_STATIC_DIR
              value: /app/web
            - name: DPO_TENANT
              value: dasmlab.org
            - name: DPO_BUILD_VERSION
              value: "__VERSION__"
            - name: DPO_CLUSTER
              value: "__CLUSTER__"
            - name: KEYCLOAK_URL
              value: "https://keycloak.apps.2026-prod-1.ocp.dasmlab.org"
            - name: KEYCLOAK_REALM
              value: dasmlab
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dpo-secrets
                  key: GITHUB_TOKEN
                  optional: true
            - name: GITHUB_REPOS
              value: "lmcdasm/dasmlab-observatory-platform,lmcdasm/cheapcloud,lmcdasm/dasmlab-cdn-mgr,lmcdasm/dasmlab_home"
            - name: DPO_SITE_BASE
              value: "https://dasmlab.org"
            - name: DPO_ACTIVITY_URL
              value: "http://surfing-service.surfing-service-system.svc.cluster.local:10023/activity?limit=200"
            - name: DPO_ACTIVITY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dpo-secrets
                  key: ACTIVITY_MACHINE_TOKEN
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dpo-data
---
apiVersion: v1
kind: Service
metadata:
  name: dpo
  namespace: dpo-system
  labels:
    app.kubernetes.io/name: dpo
spec:
  selector:
    app.kubernetes.io/name: dpo
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dpo
  namespace: dpo-system
  labels:
    app.kubernetes.io/name: dpo
spec:
  host: __ROUTE_HOST__
  to:
    kind: Service
    name: dpo
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
