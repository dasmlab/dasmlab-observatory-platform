name: DPO / Observatory Platform CX Pipeline

on:
  push:
    branches: ["**"]
  workflow_dispatch:

env:
  RUNNER_LABEL: self-hosted
  IMAGE_REPO: ghcr.io/dasmlab/dpo

concurrency:
  group: dpo-${{ github.ref == 'refs/heads/main' && 'prod' || format('preview-{0}', github.actor) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  prepare:
    runs-on: [self-hosted]
    outputs:
      version_tag: ${{ steps.meta.outputs.version_tag }}
      is_prod: ${{ steps.meta.outputs.is_prod }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          set -euo pipefail
          PKG_VER=$(grep -E '^version:' VERSION 2>/dev/null | awk '{print $2}' || true)
          if [ -z "${PKG_VER}" ] && [ -f VERSION ]; then PKG_VER=$(tr -d '[:space:]' < VERSION); fi
          if [ -z "${PKG_VER}" ]; then PKG_VER="0.1.0"; fi
          SHA=$(git rev-parse --short HEAD)
          echo "version_tag=v${PKG_VER}-${SHA}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "is_prod=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prod=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: prepare
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Go test
        run: go test ./internal/... ./cmd/...

  build-publish:
    needs: [prepare, test]
    runs-on: [self-hosted]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve GHCR token
        env:
          SECRET_PAT: ${{ secrets.DASMLAB_GHCR_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          token=""
          if [ -f "/home/dasm/gh_token" ]; then
            token="$(tr -d '\n\r' < /home/dasm/gh_token)"
          fi
          if [ -z "${token}" ] && [ -n "${SECRET_PAT:-}" ]; then
            token="${SECRET_PAT}"
          fi
          if [ -z "${token}" ] && [ -f "/home/dasm/gh-pat" ]; then
            # shellcheck disable=SC1091
            source /home/dasm/gh-pat
            token="${DASMLAB_GHCR_PAT:-${GH_TOKEN:-}}"
          fi
          if [ -z "${token}" ] && [ -n "${GITHUB_TOKEN:-}" ]; then
            token="${GITHUB_TOKEN}"
          fi
          if [ -z "${token}" ]; then
            echo "ERROR: GHCR token not set"
            exit 1
          fi
          echo "::add-mask::${token}"
          echo "GHCR_TOKEN=${token}" >> "$GITHUB_ENV"

      - name: Build image
        env:
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
        run: |
          set -euo pipefail
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH}"
          IMAGE="${IMAGE_REPO}:${VERSION_TAG}"
          if command -v buildah >/dev/null 2>&1; then
            export BUILDAH_ISOLATION=chroot
            export STORAGE_DRIVER=vfs
            export BUILDAH_RUNROOT="/tmp/buildah-runroot-dpo-${GITHUB_RUN_ID:-$$}"
            export BUILDAH_GRAPHROOT="/tmp/buildah-graphroot-dpo-${GITHUB_RUN_ID:-$$}"
            mkdir -p "${BUILDAH_RUNROOT}" "${BUILDAH_GRAPHROOT}"
            export CONTAINERS_STORAGE_CONF="/tmp/containers-storage-dpo-${GITHUB_RUN_ID:-$$}.conf"
            printf '%s\n' \
              '[storage]' \
              'driver = "vfs"' \
              "runroot = \"${BUILDAH_RUNROOT}\"" \
              "graphroot = \"${BUILDAH_GRAPHROOT}\"" \
              > "${CONTAINERS_STORAGE_CONF}"
            buildah bud --format docker -t "${IMAGE}" -f Dockerfile .
          else
            docker build -t "${IMAGE}" -f Dockerfile .
          fi
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Push image
        env:
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_REPO}:${VERSION_TAG}"
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u dasmlab --password-stdin || true
          echo "${GHCR_TOKEN}" | buildah login --username dasmlab --password-stdin ghcr.io || true
          if command -v buildah >/dev/null 2>&1 && ! docker image inspect "${IMAGE}" >/dev/null 2>&1; then
            buildah push "${IMAGE}"
          else
            docker push "${IMAGE}"
          fi

      - name: Smoke test
        env:
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_REPO}:${VERSION_TAG}"
          cid="dpo-smoke-${GITHUB_SHA::8}"
          docker rm -f "${cid}" 2>/dev/null || true
          docker pull "${IMAGE}" 2>/dev/null || true
          docker run -d --name "${cid}" -e DPO_DATA_DIR=/tmp/data "${IMAGE}"
          trap 'docker rm -f "${cid}" 2>/dev/null || true' EXIT
          ip=""
          for _ in $(seq 1 30); do
            ip="$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "${cid}" 2>/dev/null || true)"
            if [ -n "${ip}" ]; then
              break
            fi
            sleep 1
          done
          if [ -z "${ip}" ]; then
            echo "ERROR: no container IP"
            docker logs "${cid}" || true
            exit 1
          fi
          echo "smoke via http://${ip}:8080"
          for _ in $(seq 1 40); do
            if curl -fsS "http://${ip}:8080/healthz" >/dev/null 2>&1; then
              curl -fsS "http://${ip}:8080/healthz"
              exit 0
            fi
            sleep 2
          done
          docker logs "${cid}" || true
          exit 1

      - name: Ensure HAProxy CERT for DPO FQDN
        if: success() && needs.prepare.outputs.is_prod == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          for FQDN in dpo.dasmlab.org; do
            bash scripts/ci/ensure-prod-cert.sh "${FQDN}" || true
          done

  gitops-deploy:
    needs: [prepare, build-publish]
    if: success() && needs.prepare.outputs.is_prod == 'true'
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: GitOps sync
        env:
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
          SECRET_PAT: ${{ secrets.DASMLAB_GHCR_PAT }}
        run: |
          set -euo pipefail
          DEPLOY_TOKEN=""
          if [ -f "/home/dasm/gh_token" ]; then
            DEPLOY_TOKEN="$(tr -d '\n\r' < /home/dasm/gh_token)"
          fi
          if [ -z "${DEPLOY_TOKEN}" ] && [ -n "${SECRET_PAT:-}" ]; then
            DEPLOY_TOKEN="${SECRET_PAT}"
          fi
          if [ -z "${DEPLOY_TOKEN}" ] && [ -f "/home/dasm/gh-pat" ]; then
            # shellcheck disable=SC1091
            source /home/dasm/gh-pat
            DEPLOY_TOKEN="${DASMLAB_GHCR_PAT:-${GH_TOKEN:-}}"
          fi
          if [ -z "${DEPLOY_TOKEN}" ]; then
            echo "ERROR: deploy token not set"
            exit 1
          fi

          MANIFEST_SOURCE="k8s_envelope/dpo_deploy-ocp.yaml"
          declare -A ROUTE_HOSTS=(
            ["2026-prod-1"]="dpo-dasmlab.apps.2026-prod-1.ocp.dasmlab.org"
            ["2026-prod-2-1"]="dpo-dasmlab.apps.2026-prod-2-1.ocp.dasmlab.org"
          )

          git clone "https://x-access-token:${DEPLOY_TOKEN}@github.com/lmcdasm/dasmlab-live-cicd.git"
          TARGET_CLUSTERS=("2026-prod-1" "2026-prod-2-1")

          for CLUSTER_NAME in "${TARGET_CLUSTERS[@]}"; do
            if [ ! -d "dasmlab-live-cicd/clusters/${CLUSTER_NAME}" ]; then
              echo "skip missing cluster dir ${CLUSTER_NAME}"
              continue
            fi
            ROUTE_HOST="${ROUTE_HOSTS[$CLUSTER_NAME]}"
            sed -e "s|__VERSION__|${VERSION_TAG}|g" \
                -e "s|__CLUSTER__|${CLUSTER_NAME}|g" \
                -e "s|__ROUTE_HOST__|${ROUTE_HOST}|g" \
                "${MANIFEST_SOURCE}" > "generated-${CLUSTER_NAME}.yaml"
            DEPLOY_DIR="dasmlab-live-cicd/clusters/${CLUSTER_NAME}/dpo/live"
            ARCHIVE_DIR="dasmlab-live-cicd/clusters/${CLUSTER_NAME}/dpo/archived"
            mkdir -p "${ARCHIVE_DIR}" "${DEPLOY_DIR}"
            find "${DEPLOY_DIR}" -maxdepth 1 -type f -name 'dpo-v*.yaml' -exec mv {} "${ARCHIVE_DIR}/" \; 2>/dev/null || true
            cp "generated-${CLUSTER_NAME}.yaml" "${DEPLOY_DIR}/dpo-${VERSION_TAG}.yaml"
          done

          mkdir -p dasmlab-live-cicd/clusters/2026-prod-1/argocd/applications
          cp deploy/argocd/dpo-2026-prod-1.yaml \
            dasmlab-live-cicd/clusters/2026-prod-1/argocd/applications/dpo.yaml

          cd dasmlab-live-cicd
          git config user.name "dasmlab-bot"
          git config user.email "ci@dasmlab.org"
          git add .
          if git diff --cached --quiet; then
            echo "No GitOps changes"
            exit 0
          fi
          git commit -m "Auto-publish dpo ${VERSION_TAG} (ocp)"
          git push
